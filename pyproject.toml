[project]
name = "password-manager"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["cryptography"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
